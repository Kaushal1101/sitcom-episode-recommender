[project]
name = "sitcom-episode-recommender"
version = "0.1.0"
description = "Sitcom episode recommender — scraping, enrichment, and embedding layers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0",
    "torch>=2.0",
    "transformers>=4.40",
    "numpy>=1.26",
    "chromadb>=0.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
